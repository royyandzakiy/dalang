# Builds and tests release binaries, and publishes them as a GitHub Release when a v* tag is
# pushed. A manual run builds the archives as workflow artifacts without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, setup: linux, preset: clang-linux-release, asset: dalang-linux-x64 }
          - { os: windows-latest, setup: windows, preset: msvc-release, asset: dalang-windows-x64 }
          - { os: macos-latest, setup: macos, preset: appleclang-release, asset: dalang-macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with version.txt would ship a binary reporting the wrong --version.
      - name: Check tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version.txt (${version})"
            exit 1
          fi

      - name: Install toolchain (Linux)
        if: matrix.setup == 'linux'
        run: bash scripts/setup-ubuntu.sh

      - name: Set up MSVC (Windows)
        if: matrix.setup == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools (macOS)
        if: matrix.setup == 'macos'
        run: brew install ninja

      - uses: ./.github/actions/setup-pkg-manager
        with:
          os: ${{ matrix.setup }}

      - uses: ./.github/actions/cmake-build-test
        with:
          preset: ${{ matrix.preset }}
          cmake-args: -D PKG_MANAGER=conan -D BUILD_TESTING=ON
          retry: ${{ matrix.setup == 'linux' }}

      - name: Stage files
        shell: bash
        run: |
          cmake --install "build/${{ matrix.preset }}" --prefix "dist/${{ matrix.asset }}"
          cp README.md LICENSE CHANGELOG.md templates.toml "dist/${{ matrix.asset }}/"

      - name: Archive (Windows)
        if: matrix.setup == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.asset }}" -DestinationPath "dist/${{ matrix.asset }}.zip"

      - name: Archive (Linux, macOS)
        if: matrix.setup != 'windows'
        run: tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release notes are this version's section of CHANGELOG.md.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum dalang-* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "dalang ${GITHUB_REF_NAME}" \
            --notes-file notes.md
