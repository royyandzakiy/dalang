# conan-profiles/clang-cl-windows-release.ini
# The MSVC runtime is picked from the VS developer shell: VS 2026 tools (14.5x) are v145,
# VS 2022 (14.3x/14.4x) v143. Outside a dev shell this falls back to v143.
{% set vctools = os.getenv("VCToolsVersion", "") %}
[settings]
arch=x86_64
os=Windows
build_type=Release
compiler=clang
compiler.version=17
compiler.cppstd=23
compiler.runtime=dynamic
compiler.runtime_type=Release
compiler.runtime_version={{ "v145" if vctools >= "14.50" else "v143" }}

[conf]
tools.build:compiler_executables={"c":"clang-cl","cpp":"clang-cl"}
tools.cmake.cmaketoolchain:generator=Ninja
